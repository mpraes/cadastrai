<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CadastrAÍ - SAP Fiori Style Agent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!-- Login Modal -->
    <div id="login-modal" class="modal-overlay active">
        <div class="login-card">
            <div class="logo large"></div>
            <h2>Bem-vindo ao CadastrAÍ</h2>
            <p>Selecione um usuário para demonstração</p>
            <div class="login-options">
                <button class="btn btn-primary" onclick="login('admin')">
                    <strong>Admin</strong><br><small>Visualiza todos os departamentos</small>
                </button>
                <button class="btn btn-secondary" onclick="login('vendedor')">
                    <strong>Vendedor</strong><br><small>Visualiza apenas Vendas</small>
                </button>
            </div>
            <div id="login-error" class="error-text"></div>
        </div>
    </div>

    <div class="app-container" id="app-content" style="display: none;">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="brand">
                <div class="logo"></div>
                <h1>CadastrAÍ</h1>
            </div>
            <nav class="nav-menu">
                <a href="#" class="nav-item active">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                    Chat
                </a>
                <a href="#" class="nav-item">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
                    Dashboard
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="header">
                <div class="header-title">Assistente Corporativo <span class="badge" id="dept-badge"></span></div>
                <div class="user-profile">
                    <div class="avatar" id="user-avatar">?</div>
                    <span id="user-name">Carregando...</span>
                    <button class="btn-text" onclick="clearChatUI()" title="Limpar mensagens (mantém contexto)">Limpar Tela</button>
                    <button class="btn-text" onclick="logout()">Sair</button>
                </div>
            </header>

            <!-- Chat Area -->
            <div class="chat-container">
                <div class="chat-messages" id="chat-messages">
                    <div class="message system-message">
                        <div class="message-content">
                            <p>Olá! Sou o <strong>CadastrAÍ</strong>, seu assistente virtual. Posso te ajudar a cadastrar e consultar clientes no sistema.</p>
                            <p>O que você deseja fazer hoje?</p>
                        </div>
                    </div>
                </div>

                <!-- Input Area -->
                <div class="input-container">
                    <div class="input-wrapper">
                        <textarea id="message-input" placeholder="Pergunte sobre clientes ou insira novos dados..." rows="1" autofocus></textarea>
                        <button id="send-btn" class="send-btn" title="Enviar mensagem">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
